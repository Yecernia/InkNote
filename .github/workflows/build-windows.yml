name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: InkNote/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: InkNote/src-tauri -> target

      - name: Install dependencies
        working-directory: InkNote
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: InkNote
        run: pnpm test

      - name: Build Windows app & installer
        working-directory: InkNote
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.fork-win.conf.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkNote-Windows-x64
          path: |
            InkNote/src-tauri/target/release/inknote.exe
            InkNote/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
